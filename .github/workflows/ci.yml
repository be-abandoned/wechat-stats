name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node syntax check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.js | Where-Object { $_.FullName -notmatch 'node_modules' }
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "::error file=$($f.FullName),line=1::syntax error"; exit 1 }
          }
          "checked $($files.Count) files"

      - name: Python syntax check
        shell: pwsh
        run: |
          python -m py_compile scripts/gen_html.py scripts/gen_dashboard_html.py scripts/gen_race_html.py scripts/gen_combined.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::python syntax error"; exit 1 }

      - name: Install pypinyin
        run: python -m pip install --disable-pip-version-check pypinyin

      - name: Run the pipeline against the synthetic provider
        shell: pwsh
        run: |
          # Anything that goes wrong is surfaced as a GitHub annotation, so the failure is
          # readable without downloading the job log.
          function Fail([string]$msg) {
            $msg = ($msg -replace "`r?`n", " | ")
            if ($msg.Length -gt 3000) { $msg = $msg.Substring($msg.Length - 3000) }
            Write-Host "::error::$msg"
            exit 1
          }

          $providerLog = Join-Path $env:RUNNER_TEMP 'provider.log'
          $p = Start-Process -FilePath node -ArgumentList "tools/mock-provider.js" -PassThru -WindowStyle Hidden `
                 -RedirectStandardOutput $providerLog -RedirectStandardError "$providerLog.err"

          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:5032/api/sessions?limit=1' -TimeoutSec 2 -UseBasicParsing
                if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) {
              $err = (Get-Content $providerLog -Raw -ErrorAction SilentlyContinue) + (Get-Content "$providerLog.err" -Raw -ErrorAction SilentlyContinue)
              Fail "mock provider never answered: $err"
            }

            node scripts/http_stats.js *> stats.log
            if ($LASTEXITCODE -ne 0) {
              Fail ("http_stats.js failed: " + (Get-Content stats.log -Raw -ErrorAction SilentlyContinue))
            }

            python scripts/gen_html.py *> gen.log
            if ($LASTEXITCODE -ne 0) {
              Fail ("gen_html.py failed: " + (Get-Content gen.log -Raw -ErrorAction SilentlyContinue))
            }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path output/combined.html)) { Fail "output/combined.html was not produced" }
          $size = (Get-Item output/combined.html).Length
          "dashboard size: $size bytes"
          if ($size -lt 50000) { Fail "dashboard is suspiciously small ($size bytes)" }
