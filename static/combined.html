<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信统计中心</title>
<style>

* { margin:0; padding:0; box-sizing:border-box; }
body { background:#F7F8FA; color:#1f2937; font-family:'Microsoft YaHei',-apple-system,sans-serif; padding:0; }
.pg-bar { display:flex; align-items:center; justify-content:space-between; background:#fff; border-bottom:1px solid #E5E7EB; padding:10px 28px; }
.pg-tabs { display:flex; gap:4px; }
.pg-tabs button { border:none; background:none; padding:8px 18px; font-size:15px; font-weight:600; color:#6b7280; cursor:pointer; border-bottom:2px solid transparent; font-family:inherit; }
.pg-tabs button.on { color:#07C160; border-bottom-color:#07C160; }
.pg-right { display:flex; align-items:center; gap:10px; }
.pg-right .btn { padding:8px 16px; font-size:14px; font-weight:600; color:#fff; border:none; border-radius:8px; cursor:pointer; font-family:inherit; }
.pg-right .btn:disabled { opacity:.6; cursor:default; }
#refreshHint { font-size:12px; color:#9ca3af; }
.content { padding:28px; }
footer { margin-top:16px; color:#9ca3af; font-size:12px; text-align:center; }
#refreshModal .btn { padding:8px 16px; font-size:14px; border:1px solid #E5E7EB; border-radius:8px; background:#fff; cursor:pointer; color:#374151; font-family:inherit; }

/* ===== 数据看板（作用域 .pg-dash） ===== */
.pg-dash h1 { font-size:20px; font-weight:700; }
.pg-dash .sub { color:#6b7280; font-size:12px; margin:2px 0 8px; padding-left:34px; line-height:1.4; }
.pg-dash .controls { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
.pg-dash .ctrl-label { font-size:13px; color:#6b7280; }
.pg-dash .dd { position:relative; }
.pg-dash .dd-btn { display:flex; align-items:center; gap:10px; padding:7px 12px; border:1px solid #e5e7eb; border-radius:10px; background:#fff; font-size:14px; font-weight:500; color:#1f2937; cursor:pointer; outline:none; min-width:140px; transition:border-color .15s, box-shadow .15s, background .15s; }
.pg-dash .dd-btn:hover { border-color:#cbd5e1; background:#fafbfc; }
.pg-dash .dd.open .dd-btn { border-color:#07C160; box-shadow:0 0 0 3px rgba(7,193,96,.15); }
.pg-dash .dd-btn .arrow { margin-left:auto; display:flex; color:#9ca3af; transition:transform .2s; }
.pg-dash .dd.open .dd-btn .arrow { transform:rotate(180deg); color:#07C160; }
.pg-dash .dd-menu { position:absolute; top:calc(100% + 6px); left:0; width:100%; min-width:100%; background:#fff; border:1px solid #e5e7eb; border-radius:12px; box-shadow:0 12px 32px rgba(15,23,42,.12); padding:6px; z-index:50; max-height:360px; overflow-y:auto; opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .16s ease, transform .16s ease; scrollbar-width:none; -ms-overflow-style:none; }
.pg-dash .dd-menu::-webkit-scrollbar { display:none; width:0; height:0; }
.pg-dash .dd.open .dd-menu { opacity:1; transform:none; pointer-events:auto; }
.pg-dash .dd-group { padding:8px 12px 5px; font-size:11px; color:#9ca3af; font-weight:600; letter-spacing:.08em; }
.pg-dash .dd-item { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; font-size:14px; color:#374151; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pg-dash .dd-item:hover { background:#F5F5F5; }
.pg-dash .dd-item.sel { color:#07C160; font-weight:600; background:#E9F8EE; }
.pg-dash .dd-item .check { margin-left:auto; opacity:0; color:#07C160; font-size:12px; }
.pg-dash .dd-item.sel .check { opacity:1; }
.pg-dash .btn { padding:7px 14px; border:1px solid #e5e7eb; border-radius:9px; background:#fff; font-size:14px; cursor:pointer; color:#374151; }
.pg-dash .btn:hover { background:#F5F5F5; }
.pg-dash .btn.active { background:#07C160; color:#fff; border-color:#07C160; }
.pg-dash .hint { color:#9ca3af; font-size:12px; margin-left:6px; }
.pg-dash .card { background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:12px 16px; }
.pg-dash .chart-head { display:flex; justify-content:flex-end; align-items:baseline; margin-bottom:4px; }
.pg-dash .chart-title { font-size:17px; font-weight:700; color:#111827; }
.pg-dash .chart-meta { font-size:12px; color:#9ca3af; }
.pg-dash .row { display:flex; align-items:center; gap:10px; padding:3px 4px; border-bottom:1px solid #E7E7E7; will-change:transform,opacity; }
.pg-dash .row.leaving { opacity:0; transform:translateY(90px); }
.pg-dash .row:hover { background:#F5F5F5; border-radius:8px; }
.pg-dash .rank { width:28px; height:28px; border-radius:8px; background:#eef2f7; color:#64748b; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; flex-shrink:0; }
.pg-dash .rank.r1 { background:#fef3c7; color:#d97706; }
.pg-dash .rank.r2 { background:#e2e8f0; color:#64748b; }
.pg-dash .rank.r3 { background:#ffedd5; color:#ea580c; }
.pg-dash .name { width:60px; font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:0; }
.pg-dash .bar-bg { flex:1; height:18px; background:#F5F5F5; border-radius:7px; overflow:hidden; }
.pg-dash .bar { height:100%; border-radius:7px; background:linear-gradient(90deg,#9FEBBB,#07C160); min-width:2px; transition:width 1s cubic-bezier(.4,0,.2,1); }
.pg-dash .val { width:84px; text-align:right; font-weight:600; font-size:13px; font-variant-numeric:tabular-nums; flex-shrink:0; margin-left:10px; }
.pg-dash .unit { color:#9ca3af; font-size:11px; margin-left:2px; font-weight:400; }
.pg-dash .empty { text-align:center; color:#9ca3af; padding:40px; font-size:14px; }
.pg-dash footer { margin-top:16px; color:#9ca3af; font-size:12px; text-align:center; }
.pg-dash .row { cursor:pointer; }
.pg-dash .row:hover .name { color:#07C160; }
.pg-dash #viewDetail { margin:-28px; padding:0 28px 28px; }
.pg-dash .detail-top { position:sticky; top:0; z-index:20; background:#EDEDED; margin:0; padding:28px 0 14px; box-shadow:0 2px 6px rgba(0,0,0,.04); }
.pg-dash .detail-nav { margin-bottom:14px; }
.pg-dash .back-btn { display:inline-flex; align-items:center; padding:8px 16px; border:1px solid #e5e7eb; border-radius:9px; background:#fff; font-size:14px; color:#374151; cursor:pointer; transition:border-color .15s,color .15s; }
.pg-dash .back-btn:hover { border-color:#07C160; color:#07C160; }
.pg-dash .detail-head { display:flex; align-items:center; gap:16px; margin-bottom:18px; }
.pg-dash .d-avatar { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,#07C160,#0FAE6A); color:#fff; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; flex-shrink:0; }
.pg-dash .d-name { font-size:24px; font-weight:700; color:#111827; }
.pg-dash .d-sub { font-size:13px; color:#9ca3af; margin-top:4px; }
.pg-dash .d-hero { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
.pg-dash .d-hero .h-card { background:#fff; border-radius:12px; padding:16px 18px; box-shadow:0 1px 3px rgba(0,0,0,.05); text-align:center; }
.pg-dash .d-hero .h-v { font-size:30px; font-weight:800; color:#111827; font-variant-numeric:tabular-nums; line-height:1.2; }
.pg-dash .d-hero .h-l { font-size:12px; color:#9ca3af; margin-top:4px; }
.pg-dash .cmp-table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
.pg-dash .cmp-table th { padding:10px 10px; color:#9ca3af; font-size:12px; font-weight:600; border-bottom:1px solid #e5e7eb; text-align:right; white-space:nowrap; }
.pg-dash .cmp-table th:first-child { text-align:left; }
.pg-dash .cmp-table td { padding:12px 10px; text-align:right; font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
.pg-dash .cmp-table td:first-child { text-align:left; font-size:13px; }
.pg-dash .cmp-table tr.me td { color:#0E9F58; }
.pg-dash .cmp-table tr.other td { color:#4b5563; }
.pg-dash .cmp-table tr.me td:first-child, .pg-dash .cmp-table tr.other td:first-child { color:#374151; font-weight:700; }
.pg-dash .cmp-table tr.me { background:#EDF9F1; }
.pg-dash .cmp-table tr.other { background:#FAFAFA; }
.pg-dash .cmp-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px; }
.pg-dash .cmp-dot.me { background:#07C160; }
.pg-dash .cmp-dot.other { background:#cbd5e1; }
.pg-dash .detail-grid { display:flex; flex-direction:column; gap:14px; }
.pg-dash .d-card { background:#fff; border-radius:12px; padding:18px 20px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.pg-dash .d-card-title { font-size:15px; font-weight:700; color:#111827; margin-bottom:12px; }
.pg-dash .chart-box { width:100%; }
.pg-dash .chart-box svg { display:block; }
.pg-dash .chart-box rect:hover { fill:#07C160; }
.pg-dash .chart-legend { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.pg-dash .lg-chip { display:inline-flex; align-items:center; gap:8px; padding:8px 18px; border:1px solid #e5e7eb; border-radius:20px; font-size:14px; font-weight:500; color:#374151; cursor:pointer; background:#fff; transition:all .15s; user-select:none; }
.pg-dash .lg-chip:hover { border-color:#cbd5e1; }
.pg-dash .lg-chip.off { opacity:.4; background:#fafafa; }
.pg-dash .lg-chip i { width:14px; height:14px; border-radius:4px; display:inline-block; }
.pg-dash .donut-box { display:flex; align-items:center; gap:24px; flex-wrap:wrap; justify-content:center; padding:6px 0; }
.pg-dash .donut-legend { font-size:13px; color:#374151; min-width:200px; flex:1; max-width:320px; }
.pg-dash .donut-legend .lg-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.pg-dash .donut-legend .sw { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
.pg-dash .donut-legend .lg-n { font-weight:600; font-variant-numeric:tabular-nums; margin-left:14px; }
.pg-dash .d-stats { font-size:13px; color:#374151; }
.pg-dash .d-stats .s-group { font-size:12px; font-weight:700; color:#07C160; margin:12px 0 4px; }
.pg-dash .d-stats .s-group:first-child { margin-top:0; }
.pg-dash .d-stats .s-row { display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px solid #f5f5f5; gap:16px; }
.pg-dash .d-stats .s-row:last-child { border-bottom:none; }
.pg-dash .d-stats .s-l { color:#9ca3af; flex-shrink:0; }
.pg-dash .d-stats .s-v { font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }
/* ===== 聊天频率排行（作用域 .pg-race） ===== */
.pg-race .wrap { max-width:1080px; margin:0 auto; }
.pg-race h1 { font-size:24px; font-weight:700; text-align:center; }
.pg-race .sub { text-align:center; color:#6b7280; font-size:13px; margin-top:6px; }
.pg-race .date { text-align:center; font-size:44px; font-weight:800; color:#07C160; margin:14px 0 10px; font-variant-numeric:tabular-nums; }
.pg-race .card { background:#fff; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.07); padding:14px 18px; }
.pg-race #stage { width:100%; display:block; border-radius:10px; }
.pg-race .controls { display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
.pg-race .btn { display:inline-flex; align-items:center; justify-content:center; width:44px; height:40px; border:1px solid #e5e7eb; border-radius:10px; background:#fff; cursor:pointer; color:#374151; transition:background .15s, border-color .15s; }
.pg-race .btn:hover { background:#F5F5F5; }
.pg-race .btn.primary { background:#07C160; border-color:#07C160; color:#fff; width:56px; }
.pg-race .btn.primary:hover { background:#0FAE6A; }
.pg-race input[type=range] { flex:1; min-width:160px; accent-color:#07C160; height:32px; }
.pg-race .rng-info { font-size:13px; color:#6b7280; font-variant-numeric:tabular-nums; min-width:150px; text-align:center; }
.pg-race .speed { display:flex; gap:5px; flex-wrap:wrap; }
.pg-race .speed button { padding:5px 9px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; font-size:12.5px; color:#374151; cursor:pointer; white-space:nowrap; }
.pg-race .speed button.on { background:#07C160; border-color:#07C160; color:#fff; font-weight:600; }
.pg-race .ctrl-label { font-size:13px; color:#6b7280; }
.pg-race .grp { display:inline-flex; align-items:center; gap:6px; }
.pg-race .sel { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; font-size:13px; color:#374151; cursor:pointer; outline:none; }
.pg-race .sel:hover { border-color:#cbd5e1; }
.pg-race #speedRange { accent-color:#07C160; width:130px; }
.pg-race .hint { text-align:center; color:#9ca3af; font-size:12px; margin-top:10px; }
.pg-race footer { text-align:center; color:#9ca3af; font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<div class="pg-bar">
  <div class="pg-tabs">
    <button data-pg="dash" class="on">统计看板</button>
    <button data-pg="race">聊天频率排行</button>
  </div>
  <div class="pg-right">
    <button id="refreshBtn" class="btn" title="刷新数据：需要后台刷新服务运行中" style="background:#07C160;color:#fff;border:none">🔄 刷新</button>
    <span id="refreshHint" style="font-size:12px"></span>
  </div>
</div>
<div class="content">
  <section id="pg-dash" class="pg-dash">

<section id="viewList">
<h1><svg width="20" height="20" viewBox="0 0 24 24" fill="#07C160" style="vertical-align:-4px; margin-right:6px"><path d="M9.5,4C5.36,4 2,6.69 2,10C2,11.86 3.05,13.53 4.7,14.62C4.55,15.22 4.17,16.12 3.79,16.67C3.72,16.77 3.76,16.9 3.86,16.96C3.93,17 4.01,17.01 4.08,17C4.58,16.95 5.78,16.58 6.58,16.07C7.44,16.34 8.4,16.5 9.42,16.5C9.57,16.5 9.72,16.5 9.87,16.49C9.62,16.01 9.5,15.5 9.5,15C9.5,11.41 12.63,8.5 16.5,8.5C16.78,8.5 17.06,8.52 17.33,8.55C16.6,5.94 13.35,4 9.5,4M6.56,6.63C7.08,6.63 7.5,7.05 7.5,7.57C7.5,8.09 7.08,8.51 6.56,8.51C6.04,8.51 5.62,8.09 5.62,7.57C5.62,7.05 6.04,6.63 6.56,6.63M12.44,6.63C12.96,6.63 13.38,7.05 13.38,7.57C13.38,8.09 12.96,8.51 12.44,8.51C11.92,8.51 11.5,8.09 11.5,7.57C11.5,7.05 11.92,6.63 12.44,6.63M16.5,9.5C13.46,9.5 11,11.96 11,15C11,18.04 13.46,20.5 16.5,20.5C17.05,20.5 17.58,20.42 18.08,20.28C18.5,20.54 19.48,20.98 20.02,21.03C20.1,21.04 20.18,21.03 20.24,20.99C20.35,20.93 20.39,20.8 20.32,20.69C19.97,20.19 19.62,19.32 19.48,18.76C20.92,17.88 22,16.6 22,15C22,11.96 19.54,9.5 16.5,9.5M14.25,12.75C14.69,12.75 15.05,13.11 15.05,13.55C15.05,13.99 14.69,14.35 14.25,14.35C13.81,14.35 13.45,13.99 13.45,13.55C13.45,13.11 13.81,12.75 14.25,12.75M18.75,12.75C19.19,12.75 19.55,13.11 19.55,13.55C19.55,13.99 19.19,14.35 18.75,14.35C18.31,14.35 17.95,13.99 17.95,13.55C17.95,13.11 18.31,12.75 18.75,12.75Z"/></svg>微信统计看板</h1>
<div class="sub">人是一切社会关系的总和。<br><span style="display:inline-block; padding-left:8em">——马克思</span></div>

<div class="controls">
  <label class="ctrl-label">排序属性</label>
  <div class="dd">
    <button type="button" class="dd-btn" id="metricBtn">消息总数<span class="arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button>
    <div class="dd-menu" id="metricMenu"></div>
  </div>
  <label class="ctrl-label">显示</label>
  <div class="dd" style="min-width:130px">
    <button type="button" class="dd-btn" id="limitBtn">Top 20<span class="arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button>
    <div class="dd-menu" id="limitMenu"></div>
  </div>
  <label class="ctrl-label">时间</label>
  <div class="dd" style="min-width:128px">
    <button type="button" class="dd-btn" id="startBtn">—<span class="arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button>
    <div class="dd-menu" id="startMenu"></div>
  </div>
  <label class="ctrl-label">至</label>
  <div class="dd" style="min-width:128px">
    <button type="button" class="dd-btn" id="endBtn">—<span class="arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button>
    <div class="dd-menu" id="endMenu"></div>
  </div>
  <button id="resetTime" class="btn" title="恢复完整统计区间">重置时间</button>
  <button id="sortDir" class="btn active">降序 ▼</button>
  <div class="dd">
    <button type="button" class="dd-btn" id="privBtn">隐私:关<span class="arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button>
    <div class="dd-menu" id="privMenu"></div>
  </div>
  <input id="search" type="text" placeholder="搜索联系人…" style="padding:7px 14px;border:none;border-radius:18px;font-size:14px;outline:none;width:200px;background:#F5F5F5">
</div>

<div class="card">
  <div class="chart-head">
    <div class="chart-meta" id="chartMeta"></div>
  </div>
  <div id="chart" style="position:relative"></div>
</div>
</section>

<!-- ═══ 二级页面：联系人数据概览详情 ═══ -->
<section id="viewDetail" style="display:none">
  <div class="detail-top">
    <div class="detail-nav">
      <button class="back-btn" id="backBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-right:6px"><path d="m15 18-6-6 6-6"/></svg>返回统计</button>
    </div>
    <div class="detail-head">
      <div class="d-avatar" id="dAvatar"></div>
      <div>
        <div class="d-name" id="dName"></div>
        <div class="d-sub" id="dSub"></div>
      </div>
    </div>
  </div>
  <div class="d-hero" id="dHero"></div>
  <div class="d-card" style="margin-bottom:14px">
    <div class="d-card-title">双方互动对比</div>
    <div class="d-compare" id="dCompare"></div>
  </div>
  <div class="detail-grid">
    <div class="d-card wide">
      <div class="d-card-title">每月消息趋势</div>
      <div class="chart-legend" id="dMonthLegend"></div>
      <div id="dMonthChart" class="chart-box"></div>
    </div>
    <div class="d-card wide">
      <div class="d-card-title">时段活跃分布（每日 0-23 时）</div>
      <div id="dHourChart" class="chart-box"></div>
    </div>
    <div class="d-card wide">
      <div class="d-card-title">消息类型分布</div>
      <div id="dTypeChart" class="donut-box"></div>
    </div>
    <div class="d-card wide">
      <div class="d-card-title">互动与内容明细</div>
      <div id="dStats" class="d-stats"></div>
    </div>
  </div>
</section>
<footer style="text-align:right">数据更新时间：2026-08-08 18:13</footer>


<!-- 刷新进度模态弹窗 -->


  </section>
  <section id="pg-race" class="pg-race" style="display:none">

<div class="wrap">
  <h1>微信聊天频率排行</h1>
  <div class="sub" id="subEl">—</div>
  <div class="date" id="dateEl">—</div>
  <div class="card">
    <canvas id="stage" height="760"></canvas>
    <div class="controls">
      <span class="grp"><span class="ctrl-label">视图</span><span class="speed" id="viewBtns">
        <button data-v="bar" class="on">柱状</button><button data-v="line">折线</button>
      </span></span>

// 自定义下拉组件：打开/关闭、外部点击收起、选中打勾、按钮同步显示当前值
function initDD(btnId, menuId, groups, onPick, cur){
  const btn = document.getElementById(btnId);
  const menu = document.getElementById(menuId);
  const dd = btn.closest('.dd');
  let html = '';
  groups.forEach(g => {
    if (g.g) html += `<div class="dd-group">${g.g}</div>`;
    (g.items || g).forEach(it => {
      html += `<div class="dd-item" data-v="${it[0]}"><span>${it[1]}</span><span class="check">✓</span></div>`;
    });
  });
  menu.innerHTML = html;
  btn.addEventListener('click', e => { e.stopPropagation(); dd.classList.toggle('open'); });
  menu.addEventListener('click', e => {
    const it = e.target.closest('.dd-item'); if (!it) return;
    onPick(it.dataset.v);
    dd.classList.remove('open');
  });
  document.addEventListener('click', e => { if (!dd.contains(e.target)) dd.classList.remove('open'); });
  function sync(){
    const v = String(cur());
    const label = groups.flatMap(g => g.items || g).find(it => it[0] === v);
    btn.innerHTML = `<span>${label ? label[1] : ''}</span><span class="arrow">${ARROW_SVG}</span>`;
    menu.querySelectorAll('.dd-item').forEach(el => el.classList.toggle('sel', el.dataset.v === v));
  }
  sync();
  return sync;
}

// 脱敏：0 关闭 / 1 保留姓其余* / 2 拼音首字母 / 3 保留第二字；超 3 字截前 3
function maskName(n){
  const nm = String(n);
  let s = nm;
  if (privacy === 1) s = nm[0] + '*'.repeat(nm.length - 1);
  else if (privacy === 2) s = INITIALS[nm] || nm;
  else if (privacy === 3) {   // 保留第二字，其他用 *
    const c = nm[1] || nm[0];
    s = nm.length >= 3 ? '*' + c + '*' : nm.length === 2 ? '*' + c : c;
  }
  return s.length > 3 ? s.slice(0, 3) : s;
}
// 列表名字：统一只显示前 3 个字（先按隐私脱敏）；详情页展示全名（同样脱敏）
function listName(n){
  return maskName(n);
}

function getVal(r, k){
  // 时间筛选区间内，全部指标优先用区间重算值（按月聚合求和）
  const rr = rangeMap.get(r.name);
  if (rr) {
    if (k === 'seg0' || k === 'seg1' || k === 'seg2' || k === 'seg3') return rr.seg[parseInt(k[3])];
    if (k in rr) return rr[k];
  }
  return k.startsWith('seg') ? r.seg[parseInt(k[3])] : r[k];
}

// DOM 缓存：name -> row 元素（保留节点以支持柱子伸缩 + FLIP 行移动动画）
let rowCache = new Map();
const EASE = 'cubic-bezier(.65,0,.35,1)';   // easeInOutQuart：先加速后减速
let barAnim = new Map();                     // bar -> {raf}

function makeRow(name){
  const el = document.createElement('div');
  el.className = 'row';
  el.dataset.name = name;   // 点击行 → 打开该联系人的数据概览
  el.innerHTML = `
    <div class="rank"></div>
    <div class="name"></div>
    <div class="val"><span class="num"></span><span class="unit"></span></div>
    <div class="bar-bg"><div class="bar"></div></div>`;
  return el;
}
function easeInOutCubic(p){ return p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2; }

// JS 帧动画驱动柱子伸缩（1s，easeInOutCubic），绝对可靠
function animateBar(bar, to){
  if (barAnim.has(bar)) cancelAnimationFrame(barAnim.get(bar).raf);
  const from = parseFloat(bar.style.width) || 0;
  const t0 = performance.now(), dur = 1000;
  function step(now){
    const p = Math.min(1, (now - t0) / dur);
    bar.style.width = (from + (to - from) * easeInOutCubic(p)) + '%';
    if (p < 1) barAnim.set(bar, { raf: requestAnimationFrame(step) });
    else barAnim.delete(bar);
  }
  barAnim.set(bar, { raf: requestAnimationFrame(step) });
}

function render(){
  const kw = document.getElementById('search').value.trim().toLowerCase();
  const lim = limitV;
  let rows = DATA.filter(r => !kw || r.name.toLowerCase().includes(kw));
  // 时间区间预计算：区间内所有指标按月聚合（默认完整区间=全量）
  rangeMap = new Map();
  rows.forEach(r => {
    const mc = (r.d && r.d.monthCount) || {};
    const agg = { total: 0, mySend: 0, otherSend: 0, text: 0, img: 0, emoji: 0, video: 0, voice: 0, call: 0,
                  activeDays: 0, myIni: 0, otherIni: 0, seg: [0, 0, 0, 0] };
    for (const m in mc) {
      if (m >= startM && m <= endM) {
        const mm = mc[m];
        agg.total += mm.total || 0; agg.mySend += mm.my || 0; agg.otherSend += mm.other || 0;
        agg.text += mm['文本'] || 0; agg.img += mm['图片'] || 0; agg.emoji += mm['表情'] || 0;
        agg.video += mm['视频'] || 0; agg.voice += mm['语音'] || 0; agg.call += mm['通话'] || 0;
        agg.activeDays += mm.activeDays || 0; agg.myIni += mm.myIni || 0; agg.otherIni += mm.otherIni || 0;
        const s = mm.seg || [];
        for (let i = 0; i < 4; i++) agg.seg[i] += s[i] || 0;
      }
    }
    // 区间跨度（天）：结束月末 - 开始月初 + 1
    const sy = +startM.slice(0, 4), sm = +startM.slice(5), ey = +endM.slice(0, 4), em = +endM.slice(5);
    agg.spanDays = Math.round((Date.UTC(ey, em, 0) - Date.UTC(sy, sm - 1, 1)) / 86400000) + 1;
    agg.avgDaily = agg.activeDays ? +(agg.total / agg.activeDays).toFixed(1) : 0;
    rangeMap.set(r.name, agg);
  });
  rows.sort((a,b) => desc ? getVal(b,sortKey)-getVal(a,sortKey) : getVal(a,sortKey)-getVal(b,sortKey));
  const shown = rows.slice(0, lim);
  const maxV = Math.max(...shown.map(r=>getVal(r,sortKey)), 1);
  const [title, unit] = META[sortKey];

  document.getElementById('chartMeta').textContent = `显示 ${shown.length} / ${rows.length} 人 · 最大值 ${fmt(maxV)} ${unit} · ${fmtMonth(startM)} ~ ${fmtMonth(endM)}`;

  const chart = document.getElementById('chart');
  if (!rows.length) { chart.innerHTML = '<div class="empty">没有匹配的联系人</div>'; rowCache.clear(); return; }
  const emptyEl = chart.querySelector('.empty');
  if (emptyEl) emptyEl.remove();

  // ── FLIP 第一步（First）：同步记录所有现有行的视觉位置 ──
  const first = new Map();
  rowCache.forEach((el, name) => { first.set(name, el.getBoundingClientRect().top); });

  // ── 第二步：退榜行固定到当前视觉位置并脱离文档流（不影响其他人布局） ──
  const keep = new Set(shown.map(r => r.name));
  const leaving = [];
  const chartRect = chart.getBoundingClientRect();
  rowCache.forEach((el, name) => {
    if (!keep.has(name)) {
      const rc = el.getBoundingClientRect();
      el.style.position = 'absolute';
      el.style.top = (rc.top - chartRect.top + chart.scrollTop) + 'px';
      el.style.left = (rc.left - chartRect.left) + 'px';
      el.style.width = rc.width + 'px';
      el.style.zIndex = '5';
      el.style.pointerEvents = 'none';
      leaving.push(el);
      rowCache.delete(name);
    }
  });

  // ── 第三步（Last）：更新内容 + 按新顺序重排 DOM ──
  shown.forEach((r, idx) => {
    let el = rowCache.get(r.name);
    const isNew = !el;
    if (isNew) { el = makeRow(r.name); rowCache.set(r.name, el); }
    const v = getVal(r, sortKey);
    const w = Math.max(2, Math.round(v / maxV * 100));
    const bar = el.querySelector('.bar');
    if (isNew || !parseFloat(bar.style.width)) bar.style.width = w + '%';  // 新行直接到位
    else animateBar(bar, w);                                               // 已有行：柱子平滑伸缩
    el.querySelector('.num').textContent = fmt(v);
    el.querySelector('.unit').textContent = unit;
    const nm = listName(r.name);
    el.querySelector('.name').textContent = nm;
    el.querySelector('.name').title = privacy ? '' : r.name;
    const rkEl = el.querySelector('.rank');
    rkEl.textContent = idx + 1;
    rkEl.className = 'rank ' + (idx===0?'r1':idx===1?'r2':idx===2?'r3':'');
    chart.appendChild(el);   // 已有节点 = 移动；新节点 = 插入
  });

  // ── 第四步（Invert）：同一帧内同步施加反向位移，浏览器来不及绘制中间帧 ──
  const movers = [];
  shown.forEach(r => {
    const el = rowCache.get(r.name);
    el.style.transition = 'none';
    if (first.has(r.name)) {
      const delta = first.get(r.name) - el.getBoundingClientRect().top;
      if (Math.abs(delta) > 0.5) {
        el.style.transform = `translateY(${delta}px)`;   // 视觉上仍在旧位置
        movers.push(el);
      } else {
        el.style.transform = '';
      }
    } else {
      el.style.transform = 'translateY(60px)';          // 新入榜：从下方滑入
      el.style.opacity = '0';
      movers.push(el);
    }
  });
  void chart.offsetHeight;   // 一次性强制 reflow，让 Invert 状态生效

  // ── 第五步（Play）：启动过渡，各行滑向新位置；退榜行下滑淡出 ──
  movers.forEach(el => {
    el.style.transition = `transform 1s ${EASE}, opacity 1s ease`;
    el.style.transform = '';
    el.style.opacity = '1';
  });
  leaving.forEach(el => {
    el.style.transition = `transform 1s ${EASE}, opacity .8s ease`;
    el.style.transform = 'translateY(60px)';
    el.style.opacity = '0';
  });
  if (leaving.length) setTimeout(() => leaving.forEach(el => el.remove()), 1050);
}

function fmtDur(ms){
  if (ms == null) return '—';
  const m = Math.round(ms / 60000);
  if (m < 1) return Math.round(ms / 1000) + ' 秒';
  if (m < 60) return m + ' 分钟';
  const h = Math.floor(m / 60), mm = m % 60;
  if (h < 48) return h + ' 小时 ' + mm + ' 分';
  return Math.floor(h / 24) + ' 天 ' + h % 24 + ' 小时';
}
function fmtPct(r){ return r == null ? '—' : Math.round(r * 100) + '%'; }
function fmtNum(v){
  if (v >= 10000) return (v / 10000).toFixed(1).replace(/[.]0$/, '') + '万';
  return fmt(v);
}
// 生成"整数"刻度（1/2/5×10^n 步进），并保证轴顶 4×step 一定 ≥ 实际最大值（否则曲线会冲出图表）
function niceTicks(max){
  const rough = (max || 1) / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / pow;
  let step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * pow;
  while (4 * step < max) step *= 2;
  return { ticks: [step, 2 * step, 3 * step, 4 * step], max: 4 * step };
}
function sEl(tag, attrs, parent){
  const n = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

// 补全首末月之间的连续月份序列（忠实线性时间轴，空月不跳过）
function fillMonths(first, last){
  const [y1, m1] = first.split('-').map(Number);
  const [y2, m2] = last.split('-').map(Number);
  const res = [];
  let y = y1, m = m1;
  while (y < y2 || (y === y2 && m <= m2)) {
    res.push(`${y}-${String(m).padStart(2, '0')}`);
    m++; if (m > 12) { m = 1; y++; }
  }
  return res;
}

// 每月消息：左轴当月总数 + 右轴三条累计线（总数/我/对方），图例可多选显隐
const MONTH_LINES = [
  { key: 'total',    label: '当月总数',     color: '#9AA5B1', axis: 'l' },
  { key: 'cum',      label: '累计消息总数', color: '#9B8CFF', axis: 'r' },
  { key: 'cumMy',    label: '我累计消息数', color: '#5B8DEF', axis: 'r' },
  { key: 'cumOther', label: '对方累计消息数', color: '#F2A65A', axis: 'r' },
];
const monthVis = { total: true, cum: true, cumMy: false, cumOther: false };
let monthCtx = null;   // 图表上下文（供图例点击后重绘线层）

function drawMonthChart(id, monthCount, legendId){
  const box = document.getElementById(id);
  box.innerHTML = '';   // 清空容器，避免反复进入详情页叠加多幅图
  const monthsRaw = Object.keys(monthCount).sort();
  if (!monthsRaw.length) { box.innerHTML = '<div class="empty">无数据</div>'; return; }
  // 补全首末月之间所有月份：横轴忠实线性反映时间，空月补 0（不跳过）
  const months = fillMonths(monthsRaw[0], monthsRaw[monthsRaw.length - 1]);
  const rows = months.map(m => monthCount[m] || {});
  const my = rows.map(r => r.my || 0), other = rows.map(r => r.other || 0);
  const total = rows.map(r => r.total || 0);
  let aM = 0, aO = 0, aT = 0;
  const cumMy = my.map(v => (aM += v));
  const cumOther = other.map(v => (aO += v));
  const cum = total.map(v => (aT += v));
  const lt = niceTicks(Math.max(...total));
  const rt = niceTicks(Math.max(cum[cum.length - 1], cumMy[cumMy.length - 1], cumOther[cumOther.length - 1]));
  const W = 680, H = 280, PL = 52, PR = 52, PT = 20, PB = 38;
  const iw = W - PL - PR, ih = H - PT - PB;
  const x = i => PL + iw * i / (months.length - 1);
  const yL = v => PT + ih - ih * v / lt.max;
  const yR = v => PT + ih - ih * v / rt.max;
  const svg = sEl('svg', { width: '100%', viewBox: `0 0 ${W} ${H}` }, box);
  // 左轴网格 + 刻度（当月数量级）
  lt.ticks.forEach(t => {
    sEl('line', { x1: PL, y1: yL(t), x2: W - PR, y2: yL(t), stroke: '#f0f0f0', 'stroke-width': 1 }, svg);
    sEl('text', { x: PL - 8, y: yL(t) + 4, 'text-anchor': 'end', 'font-size': 10, fill: '#9ca3af' }, svg).textContent = fmtNum(t);
  });
  // 右轴刻度（累计数量级，不画网格避免错位）
  rt.ticks.forEach(t => {
    sEl('text', { x: W - PR + 8, y: yR(t) + 4, 'text-anchor': 'start', 'font-size': 10, fill: '#9ca3af' }, svg).textContent = fmtNum(t);
  });
  // X 轴月份标签（间隔显示防重叠）
  const step = Math.max(1, Math.ceil(months.length / 12));
  months.forEach((m, i) => {
    if (i % step !== 0 && i !== months.length - 1) return;
    sEl('text', { x: x(i), y: H - PB + 20, 'text-anchor': 'middle', 'font-size': 10, fill: '#9ca3af' }, svg).textContent = m.slice(2);
  });
  const lineG = sEl('g', {}, svg);
  monthCtx = { months, total, cum, cumMy, cumOther, x, yL, yR, lineG };
  buildMonthLegend(legendId);
  drawMonthLines();
}
function drawMonthLines(){
  if (!monthCtx) return;
  const { lineG } = monthCtx;
  lineG.innerHTML = '';
  monthCtx.paths = {};
  let idx = 0;
  MONTH_LINES.forEach(L => {
    if (monthVis[L.key]) showMonthLine(L, idx++);
  });
}
function getLineVals(L){
  const { total, cum, cumMy, cumOther } = monthCtx;
  return L.key === 'total' ? total : L.key === 'cum' ? cum : L.key === 'cumMy' ? cumMy : cumOther;
}
// 显示一条线（从左往右绘制动画）；idx 用于多线错开
function showMonthLine(L, idx){
  const { x, yL, yR, lineG } = monthCtx;
  const vals = getLineVals(L);
  const yfn = L.axis === 'l' ? yL : yR;
  const d = 'M' + vals.map((v, i) => `${x(i).toFixed(1)},${yfn(v).toFixed(1)}`).join(' L');
  const p = sEl('path', { d, fill: 'none', stroke: L.color, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, lineG);
  sEl('title', {}, p).textContent = L.label;
  monthCtx.paths[L.key] = p;
  const len = p.getTotalLength();
  if (len > 1) {
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    setTimeout(() => {
      p.style.transition = 'stroke-dashoffset .9s cubic-bezier(.25,.8,.25,1)';
      p.style.strokeDashoffset = '0';
    }, (idx || 0) * 120);
  }
}
// 隐藏一条线（淡出后移除，不触碰其他线）
function hideMonthLine(L){
  const p = monthCtx.paths[L.key];
  if (!p) return;
  delete monthCtx.paths[L.key];
  p.style.transition = 'opacity .35s ease';
  p.style.opacity = '0';
  setTimeout(() => p.remove(), 360);
}
function buildMonthLegend(legendId){
  const legend = document.getElementById(legendId);
  legend.innerHTML = '';
  MONTH_LINES.forEach(L => {
    const chip = document.createElement('span');
    chip.className = 'lg-chip' + (monthVis[L.key] ? '' : ' off');
    chip.innerHTML = `<i style="background:${L.color}"></i>${L.label}`;
    chip.addEventListener('click', () => {
      monthVis[L.key] = !monthVis[L.key];
      chip.classList.toggle('off', !monthVis[L.key]);
      if (monthVis[L.key]) showMonthLine(L, 0);   // 只绘制这一条
      else hideMonthLine(L);                       // 只淡出这一条
    });
    legend.appendChild(chip);
  });
}

// 时段活跃：柱状图 + 整数参考线（0-23 时，7 点起排，低饱和简约色）
// 动态效果：首次滚动进入视口时，柱子从左到右依次"长"出来
function drawHourChart(id, hourCount){
  const box = document.getElementById(id);
  box.innerHTML = '';   // 清空容器，避免反复进入详情页叠加多幅图
  const arr = hourCount || [];
  if (!arr.length) { box.innerHTML = '<div class="empty">无数据</div>'; return; }
  const W = 680, H = 260, PL = 46, PR = 20, PT = 20, PB = 38;
  const iw = W - PL - PR, ih = H - PT - PB;
  const order = [...Array(24).keys()].map(h => (h + 7) % 24);   // 7,8,...,23,0,...,6
  const { ticks, max } = niceTicks(Math.max(...arr));
  const svg = sEl('svg', { width: '100%', viewBox: `0 0 ${W} ${H}` }, box);
  ticks.forEach(t => {
    sEl('line', { x1: PL, y1: PT + ih - ih * t / max, x2: W - PR, y2: PT + ih - ih * t / max, stroke: '#f0f0f0', 'stroke-width': 1 }, svg);
    sEl('text', { x: PL - 8, y: PT + ih - ih * t / max + 4, 'text-anchor': 'end', 'font-size': 10, fill: '#9ca3af' }, svg).textContent = fmtNum(t);
  });
  const bw = iw / 24;
  const baseY = PT + ih;
  const bars = [];
  order.forEach((h, i) => {
    const v = arr[h] || 0;
    const hh = ih * v / max;
    const x0 = PL + iw * i / 24 + bw * .2, w = bw * .6;
    const r = sEl('rect', { x: x0, y: baseY, width: w, height: 0, rx: 1.5, fill: '#A8D8BC' }, svg);
    sEl('title', {}, r).textContent = `${h} 时：${fmt(v)} 条`;
    if (hh > 0) bars.push({ el: r, target: hh, baseY });
    if (i % 2 === 0 || i === 23) {
      sEl('text', { x: PL + iw * i / 24 + bw / 2, y: H - PB + 20, 'text-anchor': 'middle', 'font-size': 9.5, fill: '#9ca3af' }, svg).textContent = h + '时';
    }
  });
  // 首次进入视口（基本可见）时触发生长动画，只触发一次
  let grown = false;
  const io = new IntersectionObserver(entries => {
    if (entries.some(en => en.isIntersecting) && !grown) {
      grown = true;
      growBars(bars);
      io.disconnect();
    }
  }, { threshold: 0.15, rootMargin: '0px 0px -10% 0px' });
  io.observe(box);
}
// 柱子从左到右依次"长"出来（easeOutCubic 帧动画，每根错开 35ms）
function growBars(bars, dur = 650, stepDelay = 35){
  bars.forEach((b, i) => {
    const t0 = performance.now() + i * stepDelay;
    const baseY = b.baseY, target = b.target;
    (function step(now){
      if (now < t0) { requestAnimationFrame(step); return; }
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);   // easeOutCubic
      b.el.setAttribute('height', (target * e).toFixed(1));
      b.el.setAttribute('y', (baseY - target * e).toFixed(1));
      if (p < 1) requestAnimationFrame(step);
    })(performance.now());
  });
}

// 消息类型：环形图（SVG 弧线绘制，每段独立 path）+ 中心总数 + 图例
function drawTypeDonut(id, typeCount){
  const box = document.getElementById(id);
  box.innerHTML = '';
  const items = TYPE_ORDER.map(k => ({ k, v: typeCount[k] || 0, c: TYPE_COLORS[k] })).filter(it => it.v > 0);
  const sum = items.reduce((a, b) => a + b.v, 0);
  if (!sum) { box.innerHTML = '<div class="empty">无数据</div>'; return; }
  const S = 260, R = 92, SW = 36, CX = S / 2, CY = S / 2;
  const svg = sEl('svg', { width: S, height: S, viewBox: `0 0 ${S} ${S}` }, box);
  // 底色环
  sEl('circle', { cx: CX, cy: CY, r: R, fill: 'none', stroke: '#F0F0F0', 'stroke-width': SW }, svg);
  // 每段一条弧线（从 12 点起顺时针），初始不可见；首次下滑进入视口时"转圈画满整个环"
  let acc = 0;
  const paths = [];
  items.forEach((it, idx) => {
    const frac = it.v / sum;
    const a0 = -Math.PI / 2 + acc * 2 * Math.PI;
    const a1 = a0 + frac * 2 * Math.PI;
    const x0 = CX + R * Math.cos(a0), y0 = CY + R * Math.sin(a0);
    const x1 = CX + R * Math.cos(a1), y1 = CY + R * Math.sin(a1);
    const large = frac > .5 ? 1 : 0;
    const p = sEl('path', {
      d: `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`,
      fill: 'none', stroke: it.c, 'stroke-width': SW,
    }, svg);
    sEl('title', {}, p).textContent = `${it.k}：${fmt(it.v)} 条（${(frac * 100).toFixed(1)}%）`;
    const len = p.getTotalLength();
    if (len > 1) { p.style.strokeDasharray = len; p.style.strokeDashoffset = len; }  // 初始整段隐藏
    paths.push(p);
    acc += frac;
  });
  // 中心总数：环画完后淡入（初始透明）
  const centerT = sEl('text', { x: CX, y: CY - 2, 'text-anchor': 'middle', 'font-size': 30, 'font-weight': 800, fill: '#111827', opacity: 0 }, svg);
  centerT.textContent = fmt(sum);
  centerT.style.transition = 'opacity .4s ease';
  sEl('text', { x: CX, y: CY + 20, 'text-anchor': 'middle', 'font-size': 12, fill: '#9ca3af' }, svg).textContent = '条消息';
  // 首次进入视口（基本可见）时触发转圈动画，只播放一次
  let played = false;
  const io = new IntersectionObserver(entries => {
    if (entries.some(en => en.isIntersecting) && !played) {
      played = true;
      paths.forEach((p, idx) => {
        const len = p.getTotalLength();
        if (len > 1) {
          setTimeout(() => {
            p.style.transition = 'stroke-dashoffset .55s cubic-bezier(.25,.8,.25,1)';
            p.style.strokeDashoffset = '0';
          }, idx * 300);
        }
      });
      setTimeout(() => { centerT.style.opacity = '1'; }, paths.length * 300 + 550);
      io.disconnect();
    }
  }, { threshold: 0.15, rootMargin: '0px 0px -10% 0px' });
  io.observe(box);
  // 图例（色块 + 名称 + 数量 + 百分比）
  const leg = document.createElement('div');
  leg.className = 'donut-legend';
  leg.innerHTML = items.map(it =>
    `<div class="lg-row"><span class="sw" style="background:${it.c}"></span><span>${it.k}</span><span class="lg-n">${fmt(it.v)} · ${(it.v / sum * 100).toFixed(1).replace(/[.]0$/, '')}%</span></div>`).join('');
  box.appendChild(leg);
}

// 渲染层滑动平均（仅热度模式折线）：消除逐点锯齿，热度平滑语义不变
function smoothVals(vals, win) {
  if (vals.length <= win) return vals
  const out = new Array(vals.length)
  let sum = 0
  for (let i = 0; i < vals.length; i++) {
    sum += vals[i]
    if (i >= win) sum -= vals[i - win]
    out[i] = sum / win
  }
  return out
}
let dataSrc = 'rolling'               // 'rolling'=口径消息数 / 'heat'=综合热度
function dataOf(k, i) { return dataSrc === 'heat' ? heat[k][i] : rolling[k][i] }
function subText() {
  if (dataSrc === 'heat') return `综合热度指数 · 越高越活跃 ｜ ${MIN_DATE.slice(0, 4)}年${+MIN_DATE.slice(5, 7)}月 至 ${MAX_DATE.slice(0, 4)}年${+MAX_DATE.slice(5, 7)}月`
  return `每天统计「当天往前 ${WIN_LABELS[windowDays]}」收发消息条数 Top ${TOP_N} ｜ ${MIN_DATE.slice(0, 4)}年${+MIN_DATE.slice(5, 7)}月 至 ${MAX_DATE.slice(0, 4)}年${+MAX_DATE.slice(5, 7)}月`
}
document.getElementById('subEl').textContent = subText();

// ── 每人固定色（hash → tab20）──
const PALETTE = ['#4E79A7','#F28E2B','#E15759','#76B7B2','#59A14F','#EDC948','#B07AA1','#FF9DA7','#9C755F','#BAB0AC',
                 '#1B9E77','#D95F02','#7570B3','#E7298A','#66A61E','#E6AB02','#A6761D','#666666','#8DD3C7','#BEBADA'];
function colorFor(nm) {
  let h = 0;
  for (let i = 0; i < nm.length; i++) h = (h * 31 + nm.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

// ── 柱状图模式：榜上 Top10 颜色分配（色相环最大空隙法 + 最小间隔保护，两两不相似）──
const barHue = new Map();   // name -> 色相 0~360
function updateBarHues(curTop) {
  for (const [nm] of barHue) if (!curTop.includes(nm)) barHue.delete(nm)   // 出榜释放
  for (const nm of curTop) {
    if (barHue.has(nm)) continue
    const used = [...barHue.values()].sort((a, b) => a - b)
    const n = used.length
    let best = 0, bestGap = -1
    for (let i = 0; i <= n; i++) {
      const a = i === 0 ? (n ? used[n - 1] : 360) - 360 : used[i - 1]
      const b = i === n ? (n ? used[0] : -360) + 360 : used[i]
      const gap = b - a
      if (gap > bestGap) { bestGap = gap; best = (a + b) / 2 }
    }
    barHue.set(nm, ((best % 360) + 360) % 360)
  }
  // 最小间隔保护：若色相差 < 30°，对全部在线者均匀重排（360/N 均分，保证明显可区分）
  const hs = [...barHue.values()].sort((a, b) => a - b)
  let minGap = 360
  for (let i = 1; i < hs.length; i++) minGap = Math.min(minGap, hs[i] - hs[i - 1])
  if (hs.length > 1 && minGap < 30) {
    const step = 360 / hs.length
    ;[...barHue.keys()].forEach((nm, i) => barHue.set(nm, (i * step) % 360))   // 前导分号防 ASI 下标歧义
  }
}

// ── 折线图模式：动态前 N 名（1~32，对数滑条）+ 横轴规则（滚动90天 / 全历史压缩）──
const LINE_WIN = 90, LINE_MAX = 32;
const WIN_DAYS = { roll90: 90, roll6m: 180, roll12m: 365, full: Infinity }   // 横轴滚动窗口（天）
const nameIdx = new Map(names.map((n, i) => [n, i]));
let mode = 'bar';
let lineTop = 10;             // 当前曲线条数（1~32）
let lineAxis = 'roll';        // 'roll' 滚动90天 | 'full' 全历史压缩（左端=时间原点）
// 预计算每天 Top32 名单（N 切换无需重算，取前 N）
let TOP32_BY_DAY = buildTop32ByDay();   // 口径切换时重算
function buildTop32ByDay() {
  const out = [];
  for (let i = 0; i < dates.length; i++) {
    const arr = names.map((n, k) => [n, dataOf(k, i)]);
    arr.sort((a, b) => b[1] - a[1]);
    out.push(arr.slice(0, LINE_MAX).map(x => x[0]));
  }
  return out;
}
function curTopAt(iEnd) { return TOP32_BY_DAY[Math.min(iEnd, TOP32_BY_DAY.length - 1)].slice(0, lineTop) }
// 折线色相：色相环最大空隙法（任意 N 都两两均分色相），复用柱状同款逻辑
const lineHue = new Map();
function updateLineHues(curTop) {
  for (const [nm] of lineHue) if (!curTop.includes(nm)) lineHue.delete(nm)
  for (const nm of curTop) {
    if (lineHue.has(nm)) continue
    const used = [...lineHue.values()].sort((a, b) => a - b)
    const n = used.length
    let best = 0, bestGap = -1
    for (let i = 0; i <= n; i++) {
      const a = i === 0 ? (n ? used[n - 1] : 360) - 360 : used[i - 1]
      const b = i === n ? (n ? used[0] : -360) + 360 : used[i]
      const gap = b - a
      if (gap > bestGap) { bestGap = gap; best = (a + b) / 2 }
    }
    lineHue.set(nm, ((best % 360) + 360) % 360)
  }
  const hs = [...lineHue.values()].sort((a, b) => a - b)
  let minGap = 360
  for (let i = 1; i < hs.length; i++) minGap = Math.min(minGap, hs[i] - hs[i - 1])
  if (hs.length > 1 && minGap < 30) {
    const step = 360 / hs.length
    ;[...lineHue.keys()].forEach((nm, i) => lineHue.set(nm, (i * step) % 360))
  }
}

// ── Canvas 绘制 ──
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const dateEl = document.getElementById('dateEl');
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth - 36;
  canvas.style.width = w + 'px';
  canvas.style.height = '760px';
  canvas.width = w * dpr;

}
window.addEventListener('resize', resize);
resize();

const fmtN = v => Number(v).toLocaleString('zh-CN');

// 柱子平滑位置（排名交换时上下滑动，不跳变）
const disp = new Map();   // name -> 当前显示 y 索引（浮点）
// 坐标轴上限平滑（高速 + 大窗口口径时，maxV 随榜首突增/回落会造成柱长抖动）
let smoothMax = 1;
function trackMax(rawMax, dt) {
  const k = dt ? 1 - Math.exp(-dt * 6) : 1
  smoothMax += (rawMax - smoothMax) * k
  return Math.max(smoothMax, 1)
}

function draw(pos, dt) {
  if (mode === 'bar') drawBar(pos, dt); else drawLine(pos);
  const di = Math.round(pos);
  const d = dates[Math.min(di, dates.length - 1)];
  dateEl.textContent = d.slice(0, 4) + '年' + (+d.slice(5, 7)) + '月' + (+d.slice(8, 10)) + '日';
}
function drawBar(pos, dt) {
  const i0 = Math.min(Math.floor(pos), dates.length - 1);
  const frac = pos - Math.floor(pos);
  const i1 = Math.min(i0 + 1, dates.length - 1);
  const cur = {};
  for (let k = 0; k < names.length; k++) {
    cur[names[k]] = dataOf(k, i0) + (dataOf(k, i1) - dataOf(k, i0)) * frac;
  }
  const top = names.map(n => [n, cur[n]]).filter(t => t[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, TOP_N);   // 过滤 0 值，不拿人名+0 凑数
  const rawMax = Math.max(...top.map(t => t[1]), 1);
  const maxV = trackMax(rawMax, dt);   // 平滑轴上限，柱长变化不再随榜首跳变

  const W = canvas.width / (window.devicePixelRatio || 1);
  const H = 760;
  const PAD_L = 100, PAD_R = 150, PAD_T = 26, PAD_B = 22;
  const bw = W - PAD_L - PAD_R;
  const bh = (H - PAD_T - PAD_B) / TOP_N;
  ctx.clearRect(0, 0, W, H);

  // 榜上 Top10 颜色：色相环最大空隙分配（两两不相似）
  updateBarHues(top.map(t => t[0]));

  // ── 坐标轴：整百刻度 + 密度自适应（从 100 起步，刻度线间距 < 40px 时间隔翻倍）──
  let step = 100;
  while (bw / (maxV / step) < 40) step *= 2;   // 过密 → 100/200/300 → 200/400/600 → 400/800/1200 …
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = 1;
  ctx.font = '12px "Microsoft YaHei"';
  ctx.fillStyle = '#9ca3af';
  ctx.textAlign = 'left';
  const nLines = Math.floor(maxV / step);
  for (let i = 0; i <= nLines; i++) {
    const x = PAD_L + bw * i * step / maxV;
    ctx.beginPath(); ctx.moveTo(x, PAD_T); ctx.lineTo(x, H - PAD_B); ctx.stroke();
    ctx.fillText(fmtN(i * step), x + 5, H - PAD_B + 16);
  }

  // ── 排名位置平滑（指数逼近目标排名，柱子上下滑动不跳变）──
  const rankOf = new Map();
  top.forEach((t, i) => rankOf.set(t[0], i));
  const k = dt ? 1 - Math.exp(-dt * 9) : 1;
  for (const [nm, y] of disp) {
    if (rankOf.has(nm)) {
      const target = rankOf.get(nm);
      const ny = y + (target - y) * k;
      disp.set(nm, Math.abs(ny - target) < 0.002 ? target : ny);
    } else {
      const ny = y + (TOP_N - 0.45 - y) * k;    // 出榜：滑向榜底外消失
      if (ny > TOP_N - 0.15) disp.delete(nm); else disp.set(nm, ny);
    }
  }
  for (const t of top) if (!disp.has(t[0])) disp.set(t[0], TOP_N + 0.6);   // 新进榜：从底部滑入
  // 柱子（位置用平滑后的 disp）
  top.forEach(([nm, v], idx) => {
    const yIdx = disp.get(nm) ?? idx;
    const y = PAD_T + yIdx * bh;
    const hgt = bh * 0.72;
    const w = Math.max(2, bw * v / maxV);
    ctx.fillStyle = barHue.has(nm) ? `hsl(${barHue.get(nm).toFixed(0)}, 48%, 56%)` : colorFor(nm);
    ctx.beginPath();
    ctx.roundRect(PAD_L, y + (bh - hgt) / 2, w, hgt, 6);
    ctx.fill();
    // 名字（柱内左侧；隐私处理 + 超 3 字截前 3 字）
    const nameTxt = maskName(nm);
    ctx.fillStyle = '#1f2937';
    ctx.font = 'bold 20px "Microsoft YaHei"';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(nameTxt, PAD_L + 10, y + bh / 2);
    // 数值：放在柱子右端外侧，并避开名字区域（短柱时不互相遮挡）
    const nameW = ctx.measureText(nameTxt).width;
    const numX = PAD_L + Math.max(w + 8, nameW + 18);
    ctx.fillStyle = '#374151';
    ctx.font = 'bold 19px "Microsoft YaHei"';
    ctx.fillText(fmtN(Math.round(v)), numX, y + bh / 2);
    // 排名徽章
    const rankC = idx === 0 ? '#E6B422' : idx === 1 ? '#A8A8A8' : idx === 2 ? '#C98A5B' : '#D1D5DB';
    ctx.fillStyle = rankC;
    ctx.beginPath();
    ctx.arc(PAD_L - 38, y + bh / 2, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 15px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(String(idx + 1), PAD_L - 38, y + bh / 2 + 0.5);
  });
}
// ── 折线图：动态前 N 名曲线；横轴 roll=最近90天滚动 / full=全历史压缩（左端时间原点固定）──
function drawLine(pos) {
  const W = canvas.width / (window.devicePixelRatio || 1);
  const H = 760;
  const PAD_L = 64, PAD_R = 170, PAD_T = 26, PAD_B = 34;
  const iEnd = Math.min(Math.floor(pos), dates.length - 1);
  const winDays = WIN_DAYS[lineAxis] || 90;
  const iStart = lineAxis === 'full' ? 0 : Math.max(0, iEnd - (winDays - 1));
  const span = Math.max(iEnd - iStart, 1);
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;
  ctx.clearRect(0, 0, W, H);

  // 当前 TopN 曲线（掉出即不绘制）
  const curTop = curTopAt(iEnd);
  updateLineHues(curTop);
  let maxV = 1;
  const series = new Map();
  for (const nm of curTop) {
    const k = nameIdx.get(nm);
    const vals = [];
    for (let i = iStart; i <= iEnd; i++) { const v = dataOf(k, i); vals.push(v); if (v > maxV) maxV = v; }
    series.set(nm, dataSrc === 'heat' ? smoothVals(vals, 5) : vals);   // 热度模式渲染前 5 天滑动平均
  }

  // Y 轴整百刻度（垂直密度 < 40px 翻倍）
  let step = 100;
  while (plotH / (maxV / step) < 40) step *= 2;
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = 1;
  ctx.font = '12px "Microsoft YaHei"';
  ctx.fillStyle = '#9ca3af';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const nLines = Math.floor(maxV / step);
  for (let i = 0; i <= nLines; i++) {
    const y = PAD_T + plotH - plotH * i * step / maxV;
    ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(W - PAD_R, y); ctx.stroke();
    ctx.fillText(fmtN(i * step), PAD_L - 8, y);
  }
  // ── X 轴标签：普通日期只标月日（MM-DD），1 月 1 日下面标年份；未来区也标日期 ──
  // 滚动模式未来区 = 右侧 1/4 宽度 ≈ span/3 天
  const futureEnd = lineAxis === 'full' ? iEnd : iEnd + Math.round(span / 3);
  function dateAt(i) {
    if (i < dates.length) return dates[i]
    const d = new Date(dates[dates.length - 1] + 'T00:00:00Z')
    d.setUTCDate(d.getUTCDate() + (i - (dates.length - 1)))
    return d.toISOString().slice(0, 10)
  }
  function idxOf(ds) {
    const i = dateIdx.get(ds)
    if (i != null) return i
    const last = dates[dates.length - 1]
    return dates.length - 1 + Math.round((new Date(ds + 'T00:00:00Z') - new Date(last + 'T00:00:00Z')) / 86400000)
  }
  function xAt(i) { return lineAxis === 'full' ? PAD_L + plotW * (i - iStart) / span : PAD_L + plotW * 0.75 * (i - iStart) / span }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const labelGap = Math.max(15, Math.round(span / 10 / 15) * 15);   // 滚动模式月份标签间隔
  const monthTxt = ds => `${+ds.slice(5, 7)}月`;                       // 只显示 X月
  const YEAR_Y = H - PAD_B + 26;                                        // 年份行 = 月份下方
  if (lineAxis === 'full') {
    // 全历史：只在每年 1 月 1 日下面标年份
    ctx.font = 'bold 12px "Microsoft YaHei"';
    const y0 = +dates[iStart].slice(0, 4), y1 = +dates[iEnd].slice(0, 4)
    for (let Y = y0; Y <= y1; Y++) {
      const yi = idxOf(`${Y}-01-01`)
      if (yi >= iStart && yi <= iEnd) ctx.fillText(`${Y}年`, xAt(yi), H - PAD_B + 8)
    }
  } else {
    // 滚动：历史区 + 未来区月份标签（X月；跳过当前时间线，头顶大字已显示时间）
    ctx.font = '11px "Microsoft YaHei"';
    for (let i = 0; i <= span; i += labelGap) {
      if (i === span) continue
      ctx.fillText(monthTxt(dateAt(iStart + i)), xAt(iStart + i), H - PAD_B + 8)
    }
    for (let i = iEnd + labelGap; i <= futureEnd; i += labelGap) {
      ctx.fillText(monthTxt(dateAt(i)), xAt(i), H - PAD_B + 8)
    }
    // 年份标记：1 月下方第二行；1 月滑出左端则钉在原点；整年滑出则消失
    ctx.font = 'bold 12px "Microsoft YaHei"';
    const y0 = +dates[iStart].slice(0, 4), y1 = +dateAt(futureEnd).slice(0, 4)
    for (let Y = y0; Y <= y1; Y++) {
      const y1i = idxOf(`${Y}-01-01`), y12i = idxOf(`${Y}-12-31`)
      if (y12i < iStart) continue
      ctx.fillText(`${Y}年`, y1i >= iStart ? xAt(y1i) : PAD_L, YEAR_Y)
    }
    ctx.font = '11px "Microsoft YaHei"';
  }

  // 曲线（Catmull-Rom 平滑）；N 大时线宽减细；标签：值最大 5 人 + 最新加入 2 人（最多 7）
  // 横轴映射：滚动模式当前时间固定在 3/4 处（左侧 3/4=历史，右侧 1/4=未来）；全历史右端=当前
  const xOf = lineAxis === 'full'
    ? (i => PAD_L + plotW * (i - iStart) / span)
    : (i => PAD_L + plotW * 0.75 * (i - iStart) / span);
  const yOf = v => PAD_T + plotH - plotH * v / maxV;
  // 当前时间竖线（滚动模式，仅虚线）
  if (lineAxis !== 'full') {
    const curX = PAD_L + plotW * 0.75;
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = '#c9d2dc';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(curX, PAD_T); ctx.lineTo(curX, H - PAD_B); ctx.stroke();
    ctx.setLineDash([]);
  }
  const lw = lineTop <= 10 ? 2.6 : lineTop <= 20 ? 1.8 : 1.2;
  const labeled = pickLabeled(curTop, iEnd);
  const endPts = [];
  for (const [nm, vals] of series) {
    const hue = lineHue.get(nm)
    const c = hue != null ? `hsl(${hue.toFixed(0)}, 55%, 52%)` : '#BAB0AC';
    ctx.strokeStyle = c;
    ctx.lineWidth = lw;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    // 像素空间 DP 简化（消除锯齿）+ 直线连接真实数据点 + round 圆角 → 完全保真，杜绝贝塞尔过冲回绕
    const pts = simplifyDP(vals.map((v, i) => ({ x: xOf(iStart + i), y: yOf(v) })), 2);
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    // 端点圆点
    const ex = xOf(iEnd), ey = yOf(vals[vals.length - 1]);
    ctx.beginPath(); ctx.arc(ex, ey, lineTop <= 10 ? 4.5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = c; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    if (labeled.has(nm)) endPts.push({ nm, x: ex, y: ey, v: vals[vals.length - 1], c });
  }
  // 端点名字 + 条数（右侧，贪心防重叠）
  endPts.sort((a, b) => a.y - b.y);
  const taken = [];
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (const p of endPts) {
    let ly = p.y;
    for (const t of taken) if (Math.abs(t - ly) < 26) ly = t + 26;
    taken.push(ly);
    const nmTxt = maskName(p.nm);
    ctx.fillStyle = p.c;
    ctx.font = 'bold 15px "Microsoft YaHei"';
    ctx.fillText(nmTxt, p.x + 10, ly);
    ctx.fillStyle = '#6b7280';
    ctx.font = '13px "Microsoft YaHei"';
    ctx.fillText(fmtN(Math.round(p.v)), p.x + 10 + ctx.measureText(nmTxt).width + 8, ly);
  }
}

// 每人最早消息日索引（判定"新认识的人"：最近才开始聊天）
const firstDayIdx = {}
for (const nm of names) {
  let mn = Infinity
  const dc = DAY_DATA[nm]
  for (const k in dc) { const i = dateIdx.get(k); if (i != null && i < mn) mn = i }
  firstDayIdx[nm] = mn === Infinity ? 0 : mn
}
const JOIN_WIN = 30, NEW_WIN = 90   // 上升速度窗口 / 新认识窗口（天）
function rise30(nm, iEnd) {
  const k = nameIdx.get(nm)
  const e = Math.min(iEnd, dates.length - 1), s = Math.max(0, e - JOIN_WIN)
  return dataOf(k, e) - dataOf(k, s)
}
// 折线标签：4 个给当前值最大 + 2 个给 30 天上升最快（仅正增长）+ 2 个给新认识（最早聊天日在近 90 天）
function pickLabeled(curTop, iEnd) {
  const labeled = new Set(curTop.slice(0, 4))                       // 值最大 4 人
  curTop.filter(nm => !labeled.has(nm) && rise30(nm, iEnd) > 0)     // 排除没上升的人（如长期不聊）
    .sort((a, b) => rise30(b, iEnd) - rise30(a, iEnd))
    .slice(0, 2)
    .forEach(nm => labeled.add(nm))                                  // 30 天正增长最快 2 人
  curTop.filter(nm => !labeled.has(nm) && (iEnd - firstDayIdx[nm]) <= NEW_WIN)
    .sort((a, b) => firstDayIdx[b] - firstDayIdx[a])
    .slice(0, 2)
    .forEach(nm => labeled.add(nm))                                  // 新认识 2 人（无则自然为 0）
  return labeled
}
// 折线锯齿美化：道格拉斯-普克简化（像素空间，仅去除近直线冗余点，不改变数据真实值）
function simplifyDP(pts, eps) {
  if (pts.length < 3) return pts
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1
  const stack = [[0, pts.length - 1]]
  while (stack.length) {
    const [s, e] = stack.pop()
    const a = pts[s], b = pts[e]
    const dx = b.x - a.x, dy = b.y - a.y
    const len = Math.hypot(dx, dy) || 1
    let maxD = 0, idx = -1
    for (let i = s + 1; i < e; i++) {
      const p = pts[i]
      const d = Math.abs(dy * p.x - dx * p.y + b.x * a.y - b.y * a.x) / len
      if (d > maxD) { maxD = d; idx = i }
    }
    if (maxD > eps) { keep[idx] = 1; stack.push([s, idx], [idx, e]) }
  }
  const out = []
  for (let i = 0; i < pts.length; i++) if (keep[i]) out.push(pts[i])
  return out
}
// ── 播放控制 ──
const START_POS = dateIdx.get('2022-06-08') ?? 0;   // 默认从 2022-06-08 开始播放
let pos = START_POS, speed = DEFAULT_SPEED, playing = false, lastT = 0;   // 首次加载不自动播放
const range = document.getElementById('range');
range.max = dates.length - 1;
const rngInfo = document.getElementById('rngInfo');
const playBtn = document.getElementById('playBtn');
const playIco = document.getElementById('playIco');

function setPlaying(on) {
  playing = on;
  // 播放中显示「暂停」图标（点击=暂停），暂停时显示「播放」图标（点击=播放）
  playIco.innerHTML = on ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
}
setPlaying(playing);   // 初始化同步图标（打开即自动播放 → 显示暂停图标）
function syncRange() {
  range.value = Math.round(pos);
  const d = dates[Math.min(Math.round(pos), dates.length - 1)];
  rngInfo.textContent = d.slice(0, 4) + '-' + d.slice(5, 7) + '-' + d.slice(8, 10);
}
function frame(t) {
  if (!lastT) lastT = t;
  const dt = Math.min((t - lastT) / 1000, 0.1);
  lastT = t;
  if (playing) {
    pos += speed * dt;
    if (pos >= dates.length - 1) { pos = dates.length - 1; setPlaying(false); }
  }
  draw(pos, dt);
  syncRange();
  rafId = requestAnimationFrame(frame);
}

document.getElementById('rewBtn').addEventListener('click', () => { pos = 0; disp.clear(); setPlaying(true); });
document.getElementById('raceEndBtn').addEventListener('click', () => { pos = dates.length - 1; setPlaying(false); });
playBtn.addEventListener('click', () => setPlaying(!playing));
range.addEventListener('input', () => { pos = +range.value; setPlaying(false); draw(pos); syncRange(); });
// 隐私模式切换（关闭 / 保留姓* / 拼音首字母）
document.getElementById('privSel').addEventListener('change', () => {
  privacy = +document.getElementById('privSel').value;
  draw(pos);
});
// 数据源切换（消息数 / 热度）；热度独立于口径，口径在热度模式视觉淡化
function syncSrcUI() {
  const winSel = document.getElementById('winSel')
  if (dataSrc === 'heat') {
    winSel.style.color = '#c9d2dc'; winSel.style.borderColor = '#e5e7eb'
  } else {
    winSel.style.color = ''; winSel.style.borderColor = ''
  }
}
document.getElementById('srcSel').addEventListener('change', () => {
  dataSrc = document.getElementById('srcSel').value
  syncSrcUI()
  TOP32_BY_DAY = buildTop32ByDay()
  document.getElementById('subEl').textContent = subText()
  draw(pos); syncRange()
})
syncSrcUI()
// 窗口口径切换：热度模式不重算（热度独立于窗口），消息数模式重算 rolling + TOP32_BY_DAY 排名缓存
document.getElementById('winSel').addEventListener('change', () => {
  const v = document.getElementById('winSel').value;
  windowDays = v === 'all' ? Infinity : +v;
  if (dataSrc === 'rolling') {
    rolling = buildRollingAll()
    TOP32_BY_DAY = buildTop32ByDay()
  }
  document.getElementById('subEl').textContent = subText();
  draw(pos);
  syncRange();
});
// 倍速档位滑条（1/2/4/8/16/32 天每秒）
const speedRange = document.getElementById('speedRange');
const speedLbl = document.getElementById('speedLbl');
speedRange.addEventListener('input', () => {
  speed = 1 << +speedRange.value;
  speedLbl.textContent = '×' + speed;
});
// 折线横轴规则（滚动90天 / 全历史压缩）
document.getElementById('axisSel').addEventListener('change', () => {
  lineAxis = document.getElementById('axisSel').value;
  draw(pos);
});
// 线数：对数滑条（1~32，指数等距、允许中间值如 5/10）
const lineRange = document.getElementById('lineRange');
const lineLbl = document.getElementById('lineLbl');
function lineCountFrom(v) { return Math.max(1, Math.min(32, Math.round(Math.pow(2, v * 5)))) }
lineRange.addEventListener('input', () => {
  lineTop = lineCountFrom(+lineRange.value);
  lineLbl.textContent = lineTop;
  draw(pos);
});
// 视图默认参数：柱状=6个月口径+×32；折线=6个月口径+×32+滚动12个月+10线
function applyViewDefaults() {
  const def = mode === 'line'
    ? { windowDays: 180, speed: 32, axis: 'roll12m', lineTop: 10 }
    : { windowDays: 365, speed: 32, axis: null, lineTop: null }
  document.getElementById('winSel').value = String(def.windowDays)
  windowDays = def.windowDays
  rolling = buildRollingAll()
  TOP32_BY_DAY = buildTop32ByDay()
  document.getElementById('subEl').textContent = subText()
  const spIdx = Math.round(Math.log2(def.speed))
  speedRange.value = spIdx
  speed = 1 << spIdx
  speedLbl.textContent = '×' + speed
  if (mode === 'line') {
    document.getElementById('axisSel').value = def.axis
    lineAxis = def.axis
    lineRange.value = Math.log2(def.lineTop) / 5
    lineTop = def.lineTop
    lineLbl.textContent = lineTop
  }
}
// 视图切换（柱状 / 折线）；横轴/线数控件仅折线模式显示
function syncLineCtrls() {
  const isLine = mode === 'line'
  document.getElementById('axisGrp').style.display = isLine ? '' : 'none'
  document.getElementById('lineGrp').style.display = isLine ? '' : 'none'
}
syncLineCtrls();
document.querySelectorAll('#viewBtns button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#viewBtns button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    mode = b.dataset.v;
    syncLineCtrls();
    applyViewDefaults();
    pos = START_POS;   // 切换视图重置到 2022-06-08
    draw(pos);
    syncRange();
  });
});
document.addEventListener('keydown', e => {
  if (!active) return
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight') { pos = Math.min(pos + 1, dates.length - 1); draw(pos); syncRange(); }
  else if (e.key === 'ArrowLeft') { pos = Math.max(pos - 1, 0); draw(pos); syncRange(); }
});
let active = false, rafId = 0;
function setActive(on) {
  active = on;
  if (on) { lastT = 0; resize(); draw(pos); syncRange(); rafId = requestAnimationFrame(frame); }
  else { cancelAnimationFrame(rafId); rafId = 0; }
}
window.__raceSetActive = setActive;

if (active) rafId = requestAnimationFrame(frame);

})();
</script>
<script>

(function(){
  var tabBtns = document.querySelectorAll('.pg-tabs button');
  function switchPg(pg){
    tabBtns.forEach(function(x){ x.classList.toggle('on', x.dataset.pg === pg); });
    document.getElementById('pg-dash').style.display = pg === 'dash' ? '' : 'none';
    document.getElementById('pg-race').style.display = pg === 'race' ? '' : 'none';
    if (window.__raceSetActive) window.__raceSetActive(pg === 'race');
  }
  tabBtns.forEach(function(b){ b.addEventListener('click', function(){ switchPg(b.dataset.pg); }); });
})();

</script>
